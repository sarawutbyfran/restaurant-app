<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ByfranCircuit - Executive Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f7f6;
            --text-dark: #2d3436;
            --text-gray: #636e72;
            --primary: #0984e3;
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #d63031;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        /* Header Section */
        .header {
            background: linear-gradient(135deg, #2d3436 0%, #000000 100%);
            color: white;
            padding: 25px 20px 60px 20px;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header .subtitle {
            margin: 5px 0 0 0;
            font-size: 12px;
            color: #b2bec3;
        }
        .header .status {
            position: absolute;
            top: 25px;
            right: 20px;
            font-size: 10px;
            background: rgba(0, 184, 148, 0.2);
            color: #55efc4;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(0, 184, 148, 0.4);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .live-dot {
            width: 6px;
            height: 6px;
            background-color: #55efc4;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(85, 239, 196, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 4px rgba(85, 239, 196, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(85, 239, 196, 0); }
        }

        .container {
            padding: 0 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* KPI Cards Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: -40px;
            position: relative;
            z-index: 10;
        }

        .kpi-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
        }
        .kpi-today::before { background: var(--success); }
        .kpi-month::before { background: var(--primary); }
        .kpi-year::before { background: #6c5ce7; }

        .kpi-title {
            font-size: 13px;
            color: var(--text-gray);
            font-weight: 600;
            margin-bottom: 5px;
        }
        .kpi-amount {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .kpi-unit {
            font-size: 14px;
            color: var(--text-gray);
            font-weight: 400;
        }

        /* Responsive grid for larger screens */
        @media (min-width: 600px) {
            .kpi-grid { grid-template-columns: repeat(3, 1fr); }
            .kpi-amount { font-size: 26px; }
        }

        /* Transaction List */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0 15px 0;
        }
        .section-header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }
        .btn-refresh {
            background: #dfe6e9;
            border: none;
            color: var(--text-dark);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-refresh:active { transform: scale(0.95); }

        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 40px;
        }

        .transaction-item {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            overflow: hidden;
            transition: 0.3s ease;
        }

        .transaction-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .transaction-header:active {
            background-color: #fafafa;
        }

        .tx-info { display: flex; flex-direction: column; gap: 4px; }
        .tx-title { font-size: 14px; font-weight: 600; color: var(--text-dark); }
        .tx-time { font-size: 11px; color: var(--text-gray); }

        .tx-amount-group { text-align: right; }
        .tx-amount { font-size: 16px; font-weight: 700; color: var(--success); }
        .tx-hint { font-size: 10px; color: #b2bec3; margin-top: 2px; }

        /* Accordion Details */
        .transaction-details {
            display: none; /* ซ่อนไว้เป็นค่าเริ่มต้น */
            padding: 0 15px 15px 15px;
            border-top: 1px dashed #dfe6e9;
            background: #fafbfc;
        }
        .order-item-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 6px 0;
            border-bottom: 1px solid #f1f2f6;
            color: var(--text-gray);
        }
        .order-item-row:last-child { border-bottom: none; }
        .order-item-name { flex: 1; padding-right: 10px; }
        .order-item-qty { font-weight: 600; color: var(--text-dark); }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-gray);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>ByfranCircuit Dashboard</h1>
        <p class="subtitle">ระบบวิเคราะห์ยอดขายสำหรับผู้บริหาร</p>
        <div class="status">
            <div class="live-dot"></div>
            Real-time
        </div>
    </div>

    <div class="container">
        <div class="kpi-grid">
            <div class="kpi-card kpi-today">
                <div class="kpi-title">ยอดขายวันนี้</div>
                <div class="kpi-amount" id="salesToday">0.00 <span class="kpi-unit">฿</span></div>
            </div>
            <div class="kpi-card kpi-month">
                <div class="kpi-title">ยอดขายเดือนนี้</div>
                <div class="kpi-amount" id="salesMonth">0.00 <span class="kpi-unit">฿</span></div>
            </div>
            <div class="kpi-card kpi-year">
                <div class="kpi-title">ยอดขายรวมปีนี้</div>
                <div class="kpi-amount" id="salesYear">0.00 <span class="kpi-unit">฿</span></div>
            </div>
        </div>

        <div class="section-header">
            <h3>รายการบิลล่าสุด</h3>
            <button class="btn-refresh" onclick="loadDashboardData()">🔄 อัปเดต</button>
        </div>

        <div class="transaction-list" id="transactionList">
            <div class="empty-state">กำลังโหลดข้อมูล...</div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadDashboardData();
            // รีเฟรชอัตโนมัติทุกๆ 15 วินาที
            setInterval(loadDashboardData, 15000);
        });

        async function loadDashboardData() {
            const listContainer = document.getElementById('transactionList');
            
            try {
                // ดึงข้อมูลประวัติใบเสร็จทั้งหมด
                const res = await fetch('/api/admin/sales-history');
                const historyList = await res.json();

                // ข้อมูลวันที่ปัจจุบัน
                const now = new Date();
                const todayStr = now.toLocaleDateString('en-CA'); // รูปแบบ YYYY-MM-DD
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();

                let totalToday = 0;
                let totalMonth = 0;
                let totalYear = 0;

                // คำนวณยอดขาย
                historyList.forEach(record => {
                    const recordDate = new Date(record.checked_out_at);
                    const rDateStr = recordDate.toLocaleDateString('en-CA');
                    const rMonth = recordDate.getMonth();
                    const rYear = recordDate.getFullYear();
                    const amount = Number(record.total_price || 0);

                    // ยอดปีนี้
                    if (rYear === currentYear) {
                        totalYear += amount;
                        // ยอดเดือนนี้
                        if (rMonth === currentMonth) {
                            totalMonth += amount;
                        }
                    }
                    // ยอดวันนี้
                    if (rDateStr === todayStr) {
                        totalToday += amount;
                    }
                });

                // อัปเดตตัวเลขขึ้นหน้าจอ
                document.getElementById('salesToday').innerHTML = `${totalToday.toLocaleString('th-TH', {minimumFractionDigits: 2})} <span class="kpi-unit">฿</span>`;
                document.getElementById('salesMonth').innerHTML = `${totalMonth.toLocaleString('th-TH', {minimumFractionDigits: 2})} <span class="kpi-unit">฿</span>`;
                document.getElementById('salesYear').innerHTML = `${totalYear.toLocaleString('th-TH', {minimumFractionDigits: 2})} <span class="kpi-unit">฿</span>`;

                // จัดการแสดงผลรายการบิลล่าสุด (แสดงเฉพาะบิลของวันนี้ หรือล่าสุด 50 บิล)
                renderTransactionList(historyList);

            } catch (error) {
                console.error("Error loading dashboard:", error);
                if(listContainer.innerHTML.includes('กำลังโหลด')) {
                    listContainer.innerHTML = '<div class="empty-state" style="color:var(--danger);">ไม่สามารถเชื่อมต่อฐานข้อมูลได้</div>';
                }
            }
        }

        function renderTransactionList(historyList) {
            const listContainer = document.getElementById('transactionList');
            listContainer.innerHTML = '';

            if (!historyList || historyList.length === 0) {
                listContainer.innerHTML = '<div class="empty-state">ยังไม่มียอดขายในระบบ</div>';
                return;
            }

            // เรียงลำดับจากใหม่ไปเก่า
            historyList.sort((a, b) => new Date(b.checked_out_at) - new Date(a.checked_out_at));

            // แสดงแค่ 50 รายการล่าสุดเพื่อไม่ให้หน้าจอโหลดหนักเกินไป
            const displayList = historyList.slice(0, 50);
            
            let htmlContent = '';

            displayList.forEach(record => {
                const amount = Number(record.total_price || 0);
                const timeOpt = { hour: '2-digit', minute: '2-digit' };
                const timeStr = new Date(record.checked_out_at).toLocaleTimeString('th-TH', timeOpt);
                const dateStr = new Date(record.checked_out_at).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });

                // สร้างรายการอาหารย่อยๆ ในบิล
                let itemsHtml = '';
                if (record.items && Array.isArray(record.items)) {
                    record.items.forEach(item => {
                        let note = item.notes ? ` <span style="color:#d63031; font-size:10px;">(${item.notes})</span>` : '';
                        itemsHtml += `
                            <div class="order-item-row">
                                <div class="order-item-name">- ${item.name}${note}</div>
                                <div class="order-item-qty">x${item.quantity}</div>
                            </div>
                        `;
                    });
                } else {
                    itemsHtml = '<div class="order-item-row" style="justify-content:center;">ไม่มีรายละเอียดอาหาร</div>';
                }

                htmlContent += `
                    <div class="transaction-item">
                        <div class="transaction-header" onclick="toggleDetails('tx-${record.id}')">
                            <div class="tx-info">
                                <div class="tx-title">${record.title}</div>
                                <div class="tx-time">📅 ${dateStr} • 🕒 ${timeStr} น.</div>
                            </div>
                            <div class="tx-amount-group">
                                <div class="tx-amount">+${amount.toLocaleString('th-TH', {minimumFractionDigits: 2})}</div>
                                <div class="tx-hint">กดดูรายการ👇</div>
                            </div>
                        </div>
                        <div class="transaction-details" id="tx-${record.id}">
                            <div style="padding-top: 10px;">
                                ${itemsHtml}
                            </div>
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = htmlContent;
        }

        // ฟังก์ชันสำหรับซ่อน/แสดงรายละเอียดรายการอาหาร
        function toggleDetails(id) {
            const detailElement = document.getElementById(id);
            if (detailElement.style.display === 'block') {
                detailElement.style.display = 'none';
            } else {
                detailElement.style.display = 'block';
            }
        }
    </script>
</body>
</html>
